name: Capture v1.1 screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: compliance
          POSTGRES_PASSWORD: compliance
          POSTGRES_DB: compliance
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U compliance -d compliance"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://compliance:compliance@localhost:5432/compliance
      SECRET_KEY: capture-workflow-demo-only-secret
      AI_PROVIDER: mock
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and seed backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m alembic upgrade head
          python -m app.seed
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start application
        run: |
          (cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1) &
          (cd frontend && npm run dev -- --hostname 0.0.0.0 --port 3000 > "$RUNNER_TEMP/frontend.log" 2>&1) &
          for attempt in {1..60}; do
            curl --fail --silent http://localhost:8000/health >/dev/null && curl --fail --silent http://localhost:3000/login >/dev/null && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/backend.log"; cat "$RUNNER_TEMP/frontend.log"; exit 1
      - name: Capture real v1.1 application states
        working-directory: frontend
        run: node ../.github/scripts/capture-v11-screenshots.mjs
      - name: Validate captures
        run: |
          test "$(find captures -maxdepth 1 -name '*.png' | wc -l)" -eq 4
          file captures/*.png
          cat captures/mobile-smoke.json
      - uses: actions/upload-artifact@v7
        with:
          name: compliance-copilot-v11-screenshots
          path: captures
          if-no-files-found: error
          retention-days: 1
