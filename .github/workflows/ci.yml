name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Compose
        working-directory: .
        run: |
          cp .env.example .env
          docker compose config --quiet
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest -q
      - name: Verify Alembic schema
        run: python -m pytest app/tests/test_alembic_schema.py -q
      - name: Compile Python sources
        run: python -m compileall -q app alembic
      - name: Generate PostgreSQL migration SQL
        env:
          DATABASE_URL: postgresql+psycopg://user:password@localhost/compliance
        run: python -m alembic upgrade head --sql > $RUNNER_TEMP/schema.sql

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
